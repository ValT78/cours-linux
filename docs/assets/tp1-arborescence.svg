<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">La grande arborescence Linux</title><desc id="desc">La racine slash contient notamment home, etc, tmp, usr et var. Le dossier personnel d'Alice contient linux-hero.</desc>
  <defs><style>.t{font-family:Arial,sans-serif;fill:#102a43}.mono{font-family:monospace;fill:#102a43}.line{stroke:#7b9bbd;stroke-width:5;fill:none}</style></defs><rect width="1600" height="780" fill="#f7fbff"/>
  <text class="t" x="800" y="60" text-anchor="middle" font-size="39" font-weight="700">Linux range tout dans un seul grand arbre</text><text class="mono" x="800" y="125" text-anchor="middle" font-size="45" font-weight="700">/</text>
  <path class="line" d="M800 145 V185 M250 185 H1350 M250 185 V225 M470 185 V225 M690 185 V225 M910 185 V225 M1130 185 V225 M1350 185 V225"/>
  <g class="t" font-size="30" font-weight="700"><rect x="165" y="225" width="170" height="72" rx="16" fill="#b8f3df"/><text x="250" y="270" text-anchor="middle">home</text><rect x="385" y="225" width="170" height="72" rx="16" fill="#f6c453"/><text x="470" y="270" text-anchor="middle">etc</text><rect x="605" y="225" width="170" height="72" rx="16" fill="#dce9f5"/><text x="690" y="270" text-anchor="middle">tmp</text><rect x="825" y="225" width="170" height="72" rx="16" fill="#b8f3df"/><text x="910" y="270" text-anchor="middle">usr</text><rect x="1045" y="225" width="170" height="72" rx="16" fill="#dce9f5"/><text x="1130" y="270" text-anchor="middle">var</text><rect x="1265" y="225" width="170" height="72" rx="16" fill="#f6c453"/><text x="1350" y="270" text-anchor="middle">root</text></g>
  <g class="t" font-size="20"><text x="250" y="335" text-anchor="middle">les utilisateurs</text><text x="470" y="335" text-anchor="middle">les réglages</text><text x="690" y="335" text-anchor="middle">le temporaire</text><text x="910" y="335" text-anchor="middle">les programmes</text><text x="1130" y="335" text-anchor="middle">ce qui varie</text><text x="1350" y="335" text-anchor="middle">l'administrateur</text></g>
  <path class="line" d="M250 300 V400 M250 400 H470 M470 400 V455"/><rect x="375" y="455" width="190" height="72" rx="16" fill="#ffcc9d"/><text class="t" x="470" y="500" text-anchor="middle" font-size="30" font-weight="700">alice</text><path class="line" d="M470 528 V590"/><rect x="345" y="590" width="250" height="72" rx="16" fill="#7ece9d"/><text class="mono" x="470" y="635" text-anchor="middle" font-size="29" font-weight="700">linux-hero</text>
  <text class="t" x="800" y="730" text-anchor="middle" font-size="25">Un chemin est simplement l'itinéraire dans cet arbre : <tspan class="mono">/home/alice/linux-hero</tspan></text>
</svg>
