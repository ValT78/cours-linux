<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Le noyau Linux entre les logiciels et le matériel</title>
  <desc id="desc">Les applications, le terminal, le shell et les utilitaires sont dans l'espace utilisateur. Leurs appels système passent par le noyau Linux, qui gère les ressources et utilise des pilotes pour communiquer avec le matériel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f2944"/><stop offset="1" stop-color="#173f55"/></linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f6c453"/><stop offset="1" stop-color="#ff9f68"/></linearGradient>
    <style>.title{font-family:Arial,sans-serif;font-weight:700;fill:#fff}.label{font-family:Arial,sans-serif;font-weight:700;fill:#102a43}.small{font-family:Arial,sans-serif;fill:#334e68}.light{font-family:Arial,sans-serif;fill:#dce9f5}.mono{font-family:monospace;fill:#102a43}.flow{stroke:#8de7ef;stroke-width:7;fill:none;stroke-linecap:round}</style>
    <marker id="down" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8de7ef"/></marker>
    <marker id="up" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto"><path d="M12,0 L0,6 L12,12 Z" fill="#8de7ef"/></marker>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <text class="title" x="800" y="62" text-anchor="middle" font-size="42">Le noyau relie les logiciels aux ressources physiques</text>

  <rect x="80" y="105" width="1440" height="240" rx="28" fill="#f7fbff"/>
  <text class="label" x="120" y="152" font-size="26">ESPACE UTILISATEUR — logiciels isolés</text>
  <rect x="125" y="185" width="300" height="115" rx="20" fill="#b8f3df"/>
  <text class="label" x="275" y="230" text-anchor="middle" font-size="29">terminal</text><text class="small" x="275" y="267" text-anchor="middle" font-size="20">affiche et transmet</text>
  <rect x="475" y="185" width="300" height="115" rx="20" fill="#8de7ef"/>
  <text class="label" x="625" y="230" text-anchor="middle" font-size="29">shell Bash</text><text class="small" x="625" y="267" text-anchor="middle" font-size="20">interprète et lance</text>
  <rect x="825" y="185" width="300" height="115" rx="20" fill="#dce9f5"/>
  <text class="mono" x="975" y="230" text-anchor="middle" font-size="29">ls · grep · sleep</text><text class="small" x="975" y="267" text-anchor="middle" font-size="20">programmes en cours</text>
  <rect x="1175" y="185" width="300" height="115" rx="20" fill="#e9d5ff"/>
  <text class="label" x="1325" y="230" text-anchor="middle" font-size="29">autres logiciels</text><text class="small" x="1325" y="267" text-anchor="middle" font-size="20">navigateur, éditeur…</text>

  <path class="flow" d="M690 352 V407" marker-end="url(#down)"/><path class="flow" d="M910 407 V352" marker-end="url(#up)"/>
  <rect x="500" y="382" width="600" height="62" rx="31" fill="#102a43" stroke="#8de7ef" stroke-width="3"/>
  <text class="light" x="800" y="422" text-anchor="middle" font-size="23">APPELS SYSTÈME : ouvrir · lire · écrire · créer · terminer</text>

  <rect x="80" y="470" width="1440" height="190" rx="28" fill="url(#kernel)"/>
  <text class="label" x="800" y="525" text-anchor="middle" font-size="38">NOYAU LINUX</text>
  <text class="small" x="800" y="560" text-anchor="middle" font-size="22">protège, partage et arbitre les ressources</text>
  <g font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#102a43" text-anchor="middle">
    <rect x="160" y="586" width="245" height="48" rx="16" fill="#fff" fill-opacity=".72"/><text x="282" y="617">processus</text>
    <rect x="420" y="586" width="245" height="48" rx="16" fill="#fff" fill-opacity=".72"/><text x="542" y="617">mémoire</text>
    <rect x="680" y="586" width="245" height="48" rx="16" fill="#fff" fill-opacity=".72"/><text x="802" y="617">fichiers &amp; droits</text>
    <rect x="940" y="586" width="245" height="48" rx="16" fill="#fff" fill-opacity=".72"/><text x="1062" y="617">réseau</text>
    <rect x="1200" y="586" width="245" height="48" rx="16" fill="#fff" fill-opacity=".72"/><text x="1322" y="617">pilotes</text>
  </g>

  <path class="flow" d="M690 670 V720" marker-end="url(#down)"/><path class="flow" d="M910 720 V670" marker-end="url(#up)"/>
  <text class="light" x="800" y="704" text-anchor="middle" font-size="21">commandes des pilotes ↕ événements du matériel</text>

  <rect x="80" y="735" width="1440" height="105" rx="28" fill="#dce9f5"/>
  <text class="label" x="120" y="778" font-size="26">MATÉRIEL</text>
  <g class="small" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">
    <text x="380" y="810">processeur</text><text x="600" y="810">mémoire</text><text x="800" y="810">disque</text><text x="1000" y="810">réseau</text><text x="1230" y="810">écran · clavier · USB</text>
  </g>
</svg>
