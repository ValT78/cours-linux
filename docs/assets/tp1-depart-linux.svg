<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">De l'élève à Linux</title><desc id="desc">Un élève utilise un terminal qui communique avec le shell, Linux et le matériel.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#1f5f70"/></linearGradient><style>.label{font-family:Arial,sans-serif;font-weight:700;fill:#102a43}.small{font-family:Arial,sans-serif;fill:#243b53}.arrow{stroke:#f6c453;stroke-width:10;fill:none;stroke-linecap:round}</style><marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#f6c453"/></marker></defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <circle cx="210" cy="184" r="55" fill="#ffcc9d"/><path d="M120 340 Q210 245 300 340 L330 520 L90 520Z" fill="#ff725c"/><path d="M155 132 Q210 75 270 130 L262 166 Q210 133 158 169Z" fill="#27364a"/>
  <rect x="90" y="475" width="255" height="30" rx="10" fill="#cbd9e8"/><rect x="120" y="350" width="210" height="130" rx="12" fill="#dce9f5"/><rect x="135" y="365" width="180" height="94" rx="6" fill="#102a43"/><text x="150" y="405" font-family="monospace" font-size="25" fill="#b8f3df">$ ls /</text><text x="150" y="438" font-family="monospace" font-size="20" fill="#f6c453">home  etc  var</text><text x="210" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">toi</text>
  <path class="arrow" marker-end="url(#head)" d="M375 350 H520"/><rect x="550" y="265" width="220" height="170" rx="28" fill="#f7fbff"/><text class="label" x="660" y="335" text-anchor="middle" font-size="34">terminal</text><text class="small" x="660" y="375" text-anchor="middle" font-size="21">la fenêtre</text>
  <path class="arrow" marker-end="url(#head)" d="M795 350 H920"/><rect x="950" y="265" width="220" height="170" rx="28" fill="#b8f3df"/><text class="label" x="1060" y="335" text-anchor="middle" font-size="34">shell</text><text class="small" x="1060" y="375" text-anchor="middle" font-size="21">le traducteur</text>
  <path class="arrow" marker-end="url(#head)" d="M1195 350 H1320"/><rect x="1350" y="220" width="190" height="260" rx="28" fill="#f6c453"/><text class="label" x="1445" y="315" text-anchor="middle" font-size="34">Linux</text><text class="small" x="1445" y="355" text-anchor="middle" font-size="21">le noyau</text><text class="small" x="1445" y="389" text-anchor="middle" font-size="21">qui arbitre</text><circle cx="1400" cy="430" r="18" fill="#ff725c"/><circle cx="1445" cy="430" r="18" fill="#4ac0e0"/><circle cx="1490" cy="430" r="18" fill="#7ece9d"/>
</svg>
