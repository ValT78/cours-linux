<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">Les droits Linux sur un fichier et un répertoire</title><desc id="desc">Les lettres r, w et x ont un sens différent sur les fichiers et les répertoires.</desc><rect width="1600" height="650" fill="#f7fbff"/>
  <text x="800" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#102a43">Les mêmes lettres, deux sens différents</text>
  <g font-family="Arial,sans-serif" fill="#102a43"><rect x="95" y="125" width="630" height="430" rx="26" fill="#dce9f5"/><text x="410" y="190" text-anchor="middle" font-size="34" font-weight="700">sur un fichier</text><path d="M315 220 h160 l45 45 v190 H315z" fill="#f6c453"/><path d="M475 220 v45 h45" fill="none" stroke="#102a43" stroke-width="6"/><text x="410" y="350" text-anchor="middle" font-family="monospace" font-size="48" font-weight="700">r w x</text><text x="410" y="420" text-anchor="middle" font-size="25">lire · modifier · exécuter</text><text x="410" y="470" text-anchor="middle" font-size="22">le contenu du fichier</text></g>
  <g font-family="Arial,sans-serif" fill="#102a43"><rect x="875" y="125" width="630" height="430" rx="26" fill="#b8f3df"/><text x="1190" y="190" text-anchor="middle" font-size="34" font-weight="700">sur un répertoire</text><path d="M1050 270 h125 l32 35 h155 v165 h-312z" fill="#7ece9d"/><path d="M1050 270 h125 l32 35 h155" fill="none" stroke="#102a43" stroke-width="7"/><text x="1190" y="390" text-anchor="middle" font-family="monospace" font-size="48" font-weight="700">r w x</text><text x="1190" y="455" text-anchor="middle" font-size="25">voir les noms · ajouter/enlever · traverser</text><text x="1190" y="500" text-anchor="middle" font-size="22">la liste des entrées du dossier</text></g>
  <text x="800" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#243b53">Supprimer un fichier enlève son nom de la liste du répertoire : le droit w du dossier est donc décisif.</text>
</svg>
