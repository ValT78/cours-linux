<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Un programme devient un processus</title><desc id="desc">Le shell lance le programme sleep en un processus enfant doté de son propre PID.</desc><defs><style>.label{font-family:Arial,sans-serif;fill:#102a43}.mono{font-family:monospace;fill:#102a43}</style><marker id="h" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#ff725c"/></marker></defs>
  <rect width="1600" height="600" fill="#f7fbff"/><text class="label" x="800" y="65" text-anchor="middle" font-size="39" font-weight="700">Un fichier programme devient un processus lorsqu'il est lancé</text>
  <path d="M140 185 h240 l60 60 v185 H140z" fill="#f6c453"/><path d="M380 185 v60 h60" fill="none" stroke="#102a43" stroke-width="7"/><text class="mono" x="290" y="340" text-anchor="middle" font-size="32">/usr/bin/sleep</text><text class="label" x="290" y="405" text-anchor="middle" font-size="22">un fichier sur le disque</text>
  <path d="M490 310 H655" stroke="#ff725c" stroke-width="9" marker-end="url(#h)"/><text class="label" x="572" y="270" text-anchor="middle" font-size="23">le shell lance</text><rect x="700" y="180" width="290" height="220" rx="28" fill="#b8f3df"/><text class="label" x="845" y="255" text-anchor="middle" font-size="31" font-weight="700">shell Bash</text><text class="mono" x="845" y="305" text-anchor="middle" font-size="28">PID 4210</text><text class="label" x="845" y="355" text-anchor="middle" font-size="21">le parent</text>
  <path d="M1010 290 H1160" stroke="#ff725c" stroke-width="9" marker-end="url(#h)"/><rect x="1190" y="180" width="285" height="220" rx="28" fill="#dce9f5"/><text class="mono" x="1332" y="255" text-anchor="middle" font-size="30">sleep 300</text><text class="mono" x="1332" y="305" text-anchor="middle" font-size="28">PID 4368</text><text class="label" x="1332" y="355" text-anchor="middle" font-size="21">le processus enfant</text><text class="label" x="800" y="520" text-anchor="middle" font-size="25">Le même programme peut être lancé plusieurs fois : chaque lancement crée un processus différent.</text>
</svg>
