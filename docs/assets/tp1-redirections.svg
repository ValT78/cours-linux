<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580" role="img" aria-labelledby="title desc">
  <title id="title">Les redirections du shell</title><desc id="desc">Le texte produit par echo peut être affiché, remplacer le contenu d'un fichier ou être ajouté à sa fin. Un fichier peut aussi fournir une entrée à une commande.</desc>
  <defs><style>.t{font-family:Arial,sans-serif;fill:#102a43}.cmd{font-family:monospace;font-size:25px;fill:#fff}.caption{font-family:Arial,sans-serif;font-size:22px;fill:#243b53}.arr{stroke:#ff725c;stroke-width:7;fill:none;marker-end:url(#h)}</style><marker id="h" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#ff725c"/></marker></defs>
  <rect width="1600" height="580" fill="#f7fbff"/><text class="t" x="800" y="62" text-anchor="middle" font-size="36" font-weight="700">Les flèches changent la destination du texte</text>
  <g transform="translate(80 130)"><rect width="390" height="100" rx="18" fill="#102a43"/><text class="cmd" x="24" y="60">echo &quot;Bonjour&quot;</text><path class="arr" d="M195 110 V190"/><rect x="75" y="205" width="240" height="82" rx="16" fill="#b8f3df"/><text class="t" x="195" y="255" text-anchor="middle" font-size="24" font-weight="700">le terminal</text><text class="caption" x="195" y="335" text-anchor="middle">affiche le texte</text></g>
  <g transform="translate(605 130)"><rect width="390" height="100" rx="18" fill="#102a43"/><text class="cmd" x="22" y="60">echo &quot;Bonjour&quot; &gt; note.txt</text><path class="arr" d="M195 110 V190"/><path d="M115 205 h130 l34 34 v110 H115z" fill="#f6c453"/><path d="M245 205 v34 h34" fill="none" stroke="#102a43" stroke-width="5"/><text class="t" x="195" y="290" text-anchor="middle" font-size="23" font-weight="700">note.txt</text><text class="caption" x="195" y="375" text-anchor="middle">crée ou remplace</text></g>
  <g transform="translate(1130 130)"><rect width="390" height="100" rx="18" fill="#102a43"/><text class="cmd" x="18" y="60">echo &quot;Bonjour&quot; &gt;&gt; note.txt</text><path class="arr" d="M195 110 V190"/><path d="M115 205 h130 l34 34 v110 H115z" fill="#7ece9d"/><path d="M245 205 v34 h34" fill="none" stroke="#102a43" stroke-width="5"/><text class="t" x="195" y="290" text-anchor="middle" font-size="23" font-weight="700">note.txt</text><text class="caption" x="195" y="375" text-anchor="middle">ajoute à la fin</text></g>
  <text class="caption" x="800" y="530" text-anchor="middle">Plus tard : <tspan font-family="monospace">&lt;</tspan> fera le chemin inverse, d'un fichier vers une commande.</text>
</svg>
