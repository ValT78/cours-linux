<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Les filtres de texte Linux</title><desc id="desc">Six commandes agissent sur des lignes de texte : head, tail, wc, grep, cut, sort et tr.</desc>
  <defs><style>.t{font-family:Arial,sans-serif;fill:#102a43}.m{font-family:monospace;fill:#102a43}</style></defs><rect width="1600" height="620" fill="#f7fbff"/><text class="t" x="800" y="65" text-anchor="middle" font-size="39" font-weight="700">Chaque filtre fait une petite transformation précise</text>
  <g><rect x="70" y="150" width="300" height="145" rx="22" fill="#dce9f5"/><text class="m" x="220" y="215" text-anchor="middle" font-size="34">head / tail</text><text class="t" x="220" y="258" text-anchor="middle" font-size="22">le début ou la fin</text></g><g><rect x="440" y="150" width="300" height="145" rx="22" fill="#b8f3df"/><text class="m" x="590" y="215" text-anchor="middle" font-size="34">wc</text><text class="t" x="590" y="258" text-anchor="middle" font-size="22">compter</text></g><g><rect x="810" y="150" width="300" height="145" rx="22" fill="#f6c453"/><text class="m" x="960" y="215" text-anchor="middle" font-size="34">grep</text><text class="t" x="960" y="258" text-anchor="middle" font-size="22">garder des lignes</text></g><g><rect x="1180" y="150" width="300" height="145" rx="22" fill="#dce9f5"/><text class="m" x="1330" y="215" text-anchor="middle" font-size="34">cut</text><text class="t" x="1330" y="258" text-anchor="middle" font-size="22">prendre des colonnes</text></g>
  <g><rect x="255" y="360" width="300" height="145" rx="22" fill="#b8f3df"/><text class="m" x="405" y="425" text-anchor="middle" font-size="34">sort</text><text class="t" x="405" y="468" text-anchor="middle" font-size="22">ranger les lignes</text></g><g><rect x="650" y="360" width="300" height="145" rx="22" fill="#f6c453"/><text class="m" x="800" y="425" text-anchor="middle" font-size="34">tr</text><text class="t" x="800" y="468" text-anchor="middle" font-size="22">remplacer des caractères</text></g><g><rect x="1045" y="360" width="300" height="145" rx="22" fill="#dce9f5"/><text class="m" x="1195" y="425" text-anchor="middle" font-size="34">|</text><text class="t" x="1195" y="468" text-anchor="middle" font-size="22">les relier</text></g>
  <text class="t" x="800" y="575" text-anchor="middle" font-size="24">On combine les filtres seulement lorsque chacun a un rôle clair dans la réponse recherchée.</text>
</svg>
