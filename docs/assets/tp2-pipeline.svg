<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Une conduite relie plusieurs filtres</title><desc id="desc">Le fichier événements est lu par grep, puis sa sortie est triée avec sort avant d'être affichée dans le terminal.</desc>
  <defs><style>.t{font-family:Arial,sans-serif;fill:#102a43}.m{font-family:monospace;fill:#102a43}.a{stroke:#ff725c;stroke-width:9;fill:none;marker-end:url(#h)}</style><marker id="h" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#ff725c"/></marker></defs><rect width="1600" height="600" fill="#f7fbff"/>
  <text class="t" x="800" y="65" text-anchor="middle" font-size="39" font-weight="700">Le caractère | relie la sortie d'une commande à l'entrée de la suivante</text>
  <path d="M65 225 h185 l45 45 v170 H65z" fill="#f6c453"/><path d="M250 225 v45 h45" fill="none" stroke="#102a43" stroke-width="6"/><text class="m" x="180" y="335" text-anchor="middle" font-size="23">evenements.log</text><text class="t" x="180" y="382" text-anchor="middle" font-size="20">toutes les lignes</text>
  <path class="a" d="M330 310 H470"/><rect x="500" y="220" width="240" height="180" rx="26" fill="#b8f3df"/><text class="m" x="620" y="295" text-anchor="middle" font-size="33">grep ERREUR</text><text class="t" x="620" y="345" text-anchor="middle" font-size="21">garde les lignes</text><text class="t" x="620" y="375" text-anchor="middle" font-size="21">qui intéressent</text>
  <path class="a" d="M770 310 H910"/><rect x="940" y="220" width="200" height="180" rx="26" fill="#dce9f5"/><text class="m" x="1040" y="305" text-anchor="middle" font-size="34">sort</text><text class="t" x="1040" y="355" text-anchor="middle" font-size="21">range les lignes</text>
  <path class="a" d="M1170 310 H1305"/><rect x="1330" y="235" width="190" height="150" rx="24" fill="#102a43"/><text class="t" x="1425" y="300" text-anchor="middle" font-size="25" fill="#ffffff">terminal</text><text class="t" x="1425" y="340" text-anchor="middle" font-size="18" fill="#b8f3df">résultat final</text>
  <text class="m" x="800" y="510" text-anchor="middle" font-size="26">grep 'ERREUR' bruts/evenements.log | sort</text>
</svg>
