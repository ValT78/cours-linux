<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="590" viewBox="0 0 1600 590" role="img" aria-labelledby="title desc">
  <title id="title">Un script Bash rassemble plusieurs commandes</title><desc id="desc">Le fichier bilan.sh contient des commandes Bash et Bash les exécute dans l'ordre pour produire un rapport.</desc>
  <defs><style>.t{font-family:Arial,sans-serif;fill:#102a43}.m{font-family:monospace;fill:#102a43}.a{stroke:#ff725c;stroke-width:9;fill:none;marker-end:url(#h)}</style><marker id="h" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#ff725c"/></marker></defs><rect width="1600" height="590" fill="#f7fbff"/>
  <text class="t" x="800" y="65" text-anchor="middle" font-size="39" font-weight="700">Un script est un fichier qui garde une suite de commandes</text>
  <path d="M100 155 h390 l58 58 v245 H100z" fill="#f6c453"/><path d="M490 155 v58 h58" fill="none" stroke="#102a43" stroke-width="7"/><text class="m" x="315" y="245" text-anchor="middle" font-size="29">bilan.sh</text><text class="m" x="145" y="300" font-size="22">grep 'ERREUR' ...</text><text class="m" x="145" y="338" font-size="22">cut -d';' -f3 ...</text><text class="m" x="145" y="376" font-size="22">sort -u</text>
  <path class="a" d="M590 290 H730"/><rect x="765" y="190" width="270" height="200" rx="28" fill="#b8f3df"/><text class="t" x="900" y="265" text-anchor="middle" font-size="34" font-weight="700">Bash</text><text class="m" x="900" y="325" text-anchor="middle" font-size="26">bash bilan.sh</text>
  <path class="a" d="M1060 290 H1200"/><path d="M1230 155 h210 l58 58 v245 h-268z" fill="#dce9f5"/><path d="M1440 155 v58 h58" fill="none" stroke="#102a43" stroke-width="7"/><text class="m" x="1364" y="245" text-anchor="middle" font-size="27">bilan.txt</text><text class="t" x="1364" y="320" text-anchor="middle" font-size="23">un rapport</text><text class="t" x="1364" y="355" text-anchor="middle" font-size="23">reproductible</text>
  <text class="t" x="800" y="510" text-anchor="middle" font-size="25">Au lieu de retaper les mêmes commandes, on les sauvegarde et on les relance.</text>
</svg>
