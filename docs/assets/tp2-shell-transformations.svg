<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Le shell transforme une commande avant de la lancer</title><desc id="desc">Une commande contenant une étoile, des guillemets ou une substitution est interprétée par le shell avant que le programme ne reçoive ses arguments.</desc>
  <defs><style>.t{font-family:Arial,sans-serif;fill:#102a43}.m{font-family:monospace;fill:#102a43}.a{stroke:#ff725c;stroke-width:8;fill:none;marker-end:url(#h)}</style><marker id="h" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#ff725c"/></marker></defs><rect width="1600" height="620" fill="#f7fbff"/>
  <text class="t" x="800" y="65" text-anchor="middle" font-size="39" font-weight="700">Le shell prépare la commande avant de la lancer</text>
  <rect x="80" y="205" width="380" height="155" rx="25" fill="#dce9f5"/><text class="t" x="270" y="260" text-anchor="middle" font-size="24">ce que tu tapes</text><text class="m" x="270" y="320" text-anchor="middle" font-size="28">echo bruts/*.log</text>
  <path class="a" d="M490 283 H620"/><rect x="650" y="180" width="300" height="205" rx="28" fill="#b8f3df"/><text class="t" x="800" y="250" text-anchor="middle" font-size="32" font-weight="700">shell Bash</text><text class="t" x="800" y="300" text-anchor="middle" font-size="22">voit les caractères spéciaux</text><text class="t" x="800" y="338" text-anchor="middle" font-size="22">et les remplace</text>
  <path class="a" d="M980 283 H1110"/><rect x="1140" y="205" width="380" height="155" rx="25" fill="#f6c453"/><text class="t" x="1330" y="260" text-anchor="middle" font-size="24">ce que reçoit echo</text><text class="m" x="1330" y="320" text-anchor="middle" font-size="25">bruts/a.log bruts/b.log</text>
  <text class="t" x="800" y="505" text-anchor="middle" font-size="26">Les guillemets empêchent certaines transformations : <tspan class="m">echo "bruts/*.log"</tspan> affiche l'étoile telle quelle.</text>
</svg>
