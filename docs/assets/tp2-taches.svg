<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Avant-plan et arrière-plan dans le terminal</title><desc id="desc">Une commande au premier plan occupe le terminal. Une commande suivie d'une esperluette continue en arrière-plan pendant que le shell accepte une nouvelle commande.</desc>
  <defs><style>.t{font-family:Arial,sans-serif;fill:#102a43}.m{font-family:monospace;fill:#102a43}</style></defs><rect width="1600" height="560" fill="#f7fbff"/><text class="t" x="800" y="65" text-anchor="middle" font-size="39" font-weight="700">Le terminal peut attendre une tâche ou rester disponible</text>
  <rect x="95" y="140" width="620" height="300" rx="28" fill="#dce9f5"/><text class="t" x="405" y="205" text-anchor="middle" font-size="31" font-weight="700">avant-plan</text><text class="m" x="405" y="270" text-anchor="middle" font-size="30">sleep 30</text><path d="M260 320 H550" stroke="#ff725c" stroke-width="12" stroke-linecap="round"/><text class="t" x="405" y="385" text-anchor="middle" font-size="23">le shell attend la fin</text><text class="m" x="405" y="420" text-anchor="middle" font-size="21">Ctrl+C : interrompre</text>
  <rect x="885" y="140" width="620" height="300" rx="28" fill="#b8f3df"/><text class="t" x="1195" y="205" text-anchor="middle" font-size="31" font-weight="700">arrière-plan</text><text class="m" x="1195" y="270" text-anchor="middle" font-size="30">sleep 90 &amp;</text><path d="M1050 320 H1340" stroke="#7ece9d" stroke-width="12" stroke-linecap="round"/><text class="t" x="1195" y="385" text-anchor="middle" font-size="23">le shell répond tout de suite</text><text class="m" x="1195" y="420" text-anchor="middle" font-size="21">jobs, fg, bg, kill %1</text>
  <text class="t" x="800" y="510" text-anchor="middle" font-size="24">Les tâches concernent uniquement les commandes lancées depuis ce terminal.</text>
</svg>
